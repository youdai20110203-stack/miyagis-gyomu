<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Haiku チャット</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #0f1419;
      --bg-card: #1a1f2e;
      --accent-cyan: #00d9ff;
      --accent-purple: #a78bfa;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --success: #10b981;
    }

    html, body { height: 100%; background: var(--bg-dark); color: var(--text-primary); font-family: 'Noto Sans JP', sans-serif; }
    body { display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; overflow: hidden; }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, rgba(10,20,40,0.95), rgba(20,30,50,0.95));
      border-bottom: 1px solid var(--accent-cyan);
      padding: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 217, 255, 0.1);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 24px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 6px;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-text p {
      font-size: 11px;
      color: var(--accent-cyan);
      margin-top: 2px;
      font-family: 'Space Mono', monospace;
      font-weight: 500;
    }

    .model-badge {
      background: rgba(167, 139, 250, 0.15);
      border: 1px solid var(--accent-purple);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-purple);
      white-space: nowrap;
      font-family: 'Space Mono', monospace;
    }

    /* ===== MODE SELECTOR ===== */
    .modes {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .modes::-webkit-scrollbar { display: none; }

    .mode-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }

    .mode-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.2), rgba(167, 139, 250, 0.2));
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.2);
    }

    /* ===== CHAT AREA ===== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .welcome-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      min-height: 300px;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .welcome-state h2 {
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .welcome-state p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
    }

    .suggestion-btn {
      padding: 12px;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .suggestion-btn:hover {
      background: rgba(0, 217, 255, 0.1);
      border-color: var(--accent-cyan);
    }

    /* ===== MESSAGES ===== */
    .msg {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg.ai .msg-avatar {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
    }

    .msg.user .msg-avatar {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
    }

    .msg-content {
      max-width: 70%;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.ai .msg-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-top-left-radius: 2px;
    }

    .msg.user .msg-content {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(10, 185, 129, 0.1));
      border: 1px solid var(--success);
      border-top-right-radius: 2px;
      color: var(--text-primary);
    }

    /* ===== TYPING ===== */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-8px); }
    }

    /* ===== INPUT AREA ===== */
    .input-area {
      background: linear-gradient(180deg, rgba(10,20,40,0), rgba(10,20,40,0.8));
      border-top: 1px solid var(--border-color);
      padding: 16px;
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 217, 255, 0.15);
    }

    .input-area textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      resize: none;
      max-height: 100px;
      outline: none;
    }

    .input-area textarea::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: var(--bg-dark);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(0, 217, 255, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== ERROR STATE ===== */
    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #fca5a5;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div class="header-title">
        <div class="header-icon">🤖</div>
        <div class="header-text">
          <h1>AIチャット</h1>
          <p>Fast • Affordable • Precise</p>
        </div>
      </div>
    </div>

    <div class="modes" id="modesContainer">
      <button class="mode-btn active" data-mode="consult">🏗️ 現場相談</button>
      <button class="mode-btn" data-mode="business">📣 事業説明</button>
      <button class="mode-btn" data-mode="assistant">🛠️ 業務補助</button>
      <button class="mode-btn" data-mode="general">✨ フリーチャット</button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="welcome-state" id="welcomeState">
      <div class="welcome-icon">🤖</div>
      <h2>AIチャットへようこそ</h2>
      <p id="welcomeMsg">質問や相談を入力して、AIのサポートを受けましょう</p>
      <div class="suggestion-grid" id="suggestionGrid"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="メッセージを入力..." rows="1"></textarea>
    </div>
    <button class="send-btn" id="sendBtn">→</button>
  </div>

  <script>
    // API URL
    const API_URL = (location.protocol === 'file:')
      ? 'https://miyagi-kensetsu-ai.vercel.app/api/chat'
      : '/api/chat';

    let currentMode = 'consult';
    let history = [];
    let isLoading = false;

    const WELCOME_MESSAGES = {
      consult: '宮城の建設現場での悩みや疑問、なんでも聞いてください。工程管理から安全管理、人員配置まで対応します。',
      business: 'AI導入支援サービスについての質問をお受けします。サービス内容、料金、導入方法など、何でもお答えします。',
      assistant: '日報作成、見積もり補助、事務作業。ツール使用時の困りごとをサポートします。',
      general: 'あらゆるトピックについて、自由に会話できます。遠慮なく何でも聞いてください。'
    };

    const SUGGESTIONS = {
      consult: [
        '基礎工事で雨が続いている場合の工程調整方法',
        '足場の安全点検でチェックすべきポイント',
        '職人の定着率を上げるための施策'
      ],
      business: [
        'AI導入でどのくらい業務時間が削減される？',
        '高校生が運営していて本当に大丈夫？',
        '導入にかかる費用は？'
      ],
      assistant: [
        '「午前 基礎工事 人員3名 問題なし」を日報に',
        '外壁塗装80㎡の概算見積もり',
        'このメモを整理して要約して'
      ],
      general: [
        '簡単な夕食レシピを3つ提案して',
        'わかりやすく説明してください',
        '質問に答えてください'
      ]
    };

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeState = document.getElementById('welcomeState');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const suggestionGrid = document.getElementById('suggestionGrid');
    const modesContainer = document.getElementById('modesContainer');

    // Mode switching
    modesContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn || btn.classList.contains('active')) return;

      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      history = [];
      messageInput.value = '';
      renderWelcome();
      setTimeout(() => messageInput.focus(), 0);
    });

    // Welcome screen
    function renderWelcome() {
      chatContainer.innerHTML = '';
      welcomeMsg.textContent = WELCOME_MESSAGES[currentMode];
      suggestionGrid.innerHTML = '';

      SUGGESTIONS[currentMode].forEach(text => {
        const btn = document.createElement('button');
        btn.className = 'suggestion-btn';
        btn.textContent = text;
        btn.onclick = () => {
          messageInput.value = text;
          messageInput.focus();
          send();
        };
        suggestionGrid.appendChild(btn);
      });

      const welcome = document.createElement('div');
      welcome.className = 'welcome-state';
      welcome.appendChild(welcomeState.cloneNode(true));
      chatContainer.appendChild(welcome);
    }

    // Message rendering
    function addMessage(role, content) {
      if (welcomeState.parentNode) welcomeState.parentNode.remove();

      const msg = document.createElement('div');
      msg.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'ai' ? '🤖' : '👤';

      const msgContent = document.createElement('div');
      msgContent.className = 'msg-content';
      msgContent.textContent = content;

      msg.appendChild(avatar);
      msg.appendChild(msgContent);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg ai';
      msg.id = 'typingMsg';
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = '🤖';
      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
      msg.appendChild(avatar);
      msg.appendChild(content);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingMsg');
      if (typing) typing.remove();
    }

    function autoResize() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    }

    // Send message
    async function send() {
      const text = messageInput.value.trim();
      if (!text || isLoading) return;

      isLoading = true;
      sendBtn.disabled = true;
      addMessage('user', text);
      history.push({ role: 'user', content: text });
      messageInput.value = '';
      autoResize();
      addTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, mode: currentMode })
        });

        removeTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const errorDiv = document.createElement('div');
          errorDiv.className = 'error-msg';
          errorDiv.textContent = '⚠️ ' + (err.error || 'エラーが発生しました');
          chatContainer.appendChild(errorDiv);
          isLoading = false;
          sendBtn.disabled = false;
          return;
        }

        const data = await res.json();
        const reply = data.reply || '（応答がありません）';
        addMessage('ai', reply);
        history.push({ role: 'assistant', content: reply });
      } catch (e) {
        removeTyping();
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-msg';
        errorDiv.textContent = '⚠️ 通信エラー: ' + e.message;
        chatContainer.appendChild(errorDiv);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    // Event listeners
    messageInput.addEventListener('input', autoResize);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener('click', send);

    // Initialize
    renderWelcome();
  </script>
</body>
</html>
