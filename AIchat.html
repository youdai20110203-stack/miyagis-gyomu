<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miyagi's 業務 Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1c2f5e;
      --navy-mid: #2a4480;
      --accent: #e8a020;
      --accent2: #f0c060;
      --white: #fff;
      --off: #f7f8fb;
      --border: #e2e6f0;
      --muted: #6b7a99;
      --ink: #111827;
      --r: 14px;
      --r-sm: 10px;
      --sh: 0 2px 12px rgba(28,47,94,.08);
      --sh-m: 0 6px 28px rgba(28,47,94,.14);
    }

    html { font-family: 'Noto Sans JP', sans-serif; background: var(--off); color: var(--ink); -webkit-tap-highlight-color: transparent; }
    body {
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--off);
    }

    /* ===== HEADER ===== */
    .header {
      background: var(--navy);
      padding: 14px 16px 0;
      flex-shrink: 0;
      box-shadow: var(--sh-m);
      z-index: 10;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }
    .header-brand-text h1 {
      color: var(--white);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .header-brand-text p {
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      margin-top: 2px;
    }

    /* ===== MODE TABS ===== */
    .modes {
      display: flex;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      padding: 11px 4px 12px;
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      transition: all 0.18s;
      white-space: nowrap;
    }
    .mode-btn.active {
      color: var(--white);
      border-bottom-color: var(--accent);
    }

    /* ===== CHAT AREA ===== */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== WELCOME ===== */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 12px;
    }
    .welcome-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: var(--sh);
    }
    .welcome h2 {
      font-size: 17px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .welcome p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 22px;
      max-width: 360px;
    }
    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      width: 100%;
    }
    .suggestion {
      padding: 13px 15px;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: var(--sh);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .suggestion::before {
      content: '💬';
      font-size: 14px;
      flex-shrink: 0;
    }
    .suggestion:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* ===== MESSAGES ===== */
    .msg {
      display: flex;
      gap: 9px;
      animation: slideIn 0.28s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .msg.ai .msg-avatar {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
    }
    .msg.user .msg-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    .msg-content {
      max-width: 76%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.ai .msg-content {
      background: var(--white);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--ink);
      box-shadow: var(--sh);
    }
    .msg.user .msg-content {
      background: var(--navy);
      border-top-right-radius: 4px;
      color: var(--white);
    }

    /* ===== TYPING ===== */
    .typing { display: flex; gap: 5px; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--navy-mid);
      animation: bounce 0.9s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ===== INPUT ===== */
    .input-bar {
      flex-shrink: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 11px 12px calc(11px + env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 9px;
    }
    .input-bar textarea {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 11px 16px;
      font-family: inherit;
      font-size: 15px;
      resize: none;
      max-height: 110px;
      line-height: 1.4;
      outline: none;
      background: var(--off);
      transition: border-color 0.18s;
    }
    .input-bar textarea:focus { border-color: var(--navy-mid); background: var(--white); }
    .send-btn {
      width: 44px; height: 44px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: var(--white);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== ERROR ===== */
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12.5px;
      padding: 11px 14px;
      border-radius: var(--r-sm);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-brand">
      <div class="header-logo">💬</div>
      <div class="header-brand-text">
        <h1>Miyagi's 業務 Chat</h1>
        <p>AIアシスタント</p>
      </div>
    </div>
    <div class="modes" id="modesContainer">
      <button class="mode-btn active" data-mode="consult">現場相談</button>
      <button class="mode-btn" data-mode="business">事業説明</button>
      <button class="mode-btn" data-mode="assistant">業務補助</button>
      <button class="mode-btn" data-mode="general">フリー</button>
    </div>
  </div>

  <div class="chat" id="chatContainer"></div>

  <div class="input-bar">
    <textarea id="messageInput" placeholder="メッセージを入力..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" aria-label="送信">➤</button>
  </div>

  <script>
    const API_URL = (location.protocol === 'file:')
      ? 'https://miyagi-kensetsu-ai.vercel.app/api/chat'
      : '/api/chat';

    let currentMode = 'consult';
    let histories = { consult: [], business: [], assistant: [], general: [] };
    let isLoading = false;

    const WELCOME_TITLES = {
      consult: '現場相談',
      business: '事業説明',
      assistant: '業務補助',
      general: 'フリーチャット'
    };

    const WELCOME_MESSAGES = {
      consult: '宮城の建設現場での悩みや疑問、なんでも聞いてください。工程管理から安全管理、人員配置まで対応します。',
      business: 'AI導入支援サービスについての質問をお受けします。サービス内容、料金、導入方法など、何でもお答えします。',
      assistant: '日報作成、見積もり補助、事務作業。ツール使用時の困りごとをサポートします。',
      general: 'あらゆるトピックについて、自由に会話できます。遠慮なく何でも聞いてください。'
    };

    const SUGGESTIONS = {
      consult: [
        '基礎工事で雨が続いている場合の工程調整方法',
        '足場の安全点検でチェックすべきポイント',
        '職人の定着率を上げるための施策'
      ],
      business: [
        'AI導入でどのくらい業務時間が削減される？',
        '高校生が運営していて本当に大丈夫？',
        '導入にかかる費用は？'
      ],
      assistant: [
        '「午前 基礎工事 人員3名 問題なし」を日報に',
        '外壁塗装80㎡の概算見積もり',
        'このメモを整理して要約して'
      ],
      general: [
        '簡単な夕食レシピを3つ提案して',
        'わかりやすく説明してください',
        '質問に答えてください'
      ]
    };

    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const modesContainer = document.getElementById('modesContainer');

    // モード切替
    modesContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn || btn.classList.contains('active')) return;

      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      messageInput.value = '';
      autoResize();

      if (histories[currentMode].length === 0) {
        renderWelcome();
      } else {
        chatContainer.innerHTML = '';
        histories[currentMode].forEach(m => addMessage(m.role, m.content));
      }
      setTimeout(() => messageInput.focus(), 0);
    });

    // ウェルカム画面
    function renderWelcome() {
      chatContainer.innerHTML = '';
      const w = document.createElement('div');
      w.className = 'welcome';
      w.innerHTML = `
        <div class="welcome-icon">🤖</div>
        <h2>${WELCOME_TITLES[currentMode]}</h2>
        <p>${WELCOME_MESSAGES[currentMode]}</p>
        <div class="suggestions"></div>
      `;
      const grid = w.querySelector('.suggestions');
      SUGGESTIONS[currentMode].forEach(text => {
        const b = document.createElement('button');
        b.className = 'suggestion';
        b.textContent = text;
        b.onclick = () => { messageInput.value = text; send(); };
        grid.appendChild(b);
      });
      chatContainer.appendChild(w);
    }

    function clearWelcome() {
      const w = chatContainer.querySelector('.welcome');
      if (w) w.remove();
    }

    function addMessage(role, content) {
      clearWelcome();
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'ai' ? '🤖' : '👤';
      const c = document.createElement('div');
      c.className = 'msg-content';
      c.textContent = content;
      msg.appendChild(avatar);
      msg.appendChild(c);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function addTyping() {
      const msg = document.createElement('div');
      msg.className = 'msg ai';
      msg.id = 'typingMsg';
      msg.innerHTML = `<div class="msg-avatar">🤖</div>
        <div class="msg-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    function removeTyping() {
      const t = document.getElementById('typingMsg');
      if (t) t.remove();
    }

    function showError(text) {
      removeTyping();
      const e = document.createElement('div');
      e.className = 'error-msg';
      e.textContent = '⚠️ ' + text;
      chatContainer.appendChild(e);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function autoResize() {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + 'px';
    }

    async function send() {
      const text = messageInput.value.trim();
      if (!text || isLoading) return;

      isLoading = true;
      sendBtn.disabled = true;
      addMessage('user', text);
      histories[currentMode].push({ role: 'user', content: text });
      messageInput.value = '';
      autoResize();
      addTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: histories[currentMode], mode: currentMode })
        });
        removeTyping();

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(err.error || `エラー (${res.status})`);
          isLoading = false; sendBtn.disabled = false;
          return;
        }

        const data = await res.json();
        const reply = data.reply || '（応答がありません）';
        addMessage('ai', reply);
        histories[currentMode].push({ role: 'assistant', content: reply });
      } catch (e) {
        showError('通信エラー: ' + e.message);
      } finally {
        isLoading = false;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    messageInput.addEventListener('input', autoResize);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    sendBtn.addEventListener('click', send);

    renderWelcome();
  </script>
</body>
</html>
